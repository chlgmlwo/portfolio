<style>
/* 없는 주소로 들어왔을 때: 바탕화면 위 오류 대화 상자 */
.err-wrap { min-height: calc(100vh - 56px - env(safe-area-inset-bottom, 0px)); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.dialog { width: min(460px, 100%); background: var(--mica); backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4); border-radius: 8px; box-shadow: 0 16px 48px rgba(0, 0, 0, .28), 0 0 0 1px rgba(0, 0, 0, .06); overflow: hidden; }
.dialog .bar { padding-right: 0; }
.dialog .ctl a { width: 46px; align-self: stretch; display: grid; place-items: center; text-decoration: none; font-size: 12px; color: var(--ink); }
.dialog .ctl a:hover { background: var(--close); color: #fff; }
.d-body { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; padding: 10px 24px 22px; }
.d-icon { width: 40px; height: 40px; border-radius: 50%; background: #c42b1c; color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 700; }
.d-body h1 { margin: 6px 0 6px; font-size: 18px; font-weight: 600; }
.d-body p { margin: 0; font-size: 14px; color: var(--mute); }
.d-body code { font-family: var(--mono); font-size: 12.5px; background: #fff; border: 1px solid var(--stroke2); border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }
.d-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; background: rgba(0, 0, 0, .035); border-top: 1px solid var(--stroke); }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/portfolio/os/index.html" aria-label="시작"><b>최희재</b></a>
    <nav class="site" aria-label="작업 표시줄"><a href="/portfolio/os/index.html">바탕화면</a></nav>
  </div>
</header>
<main class="err-wrap">
  <div class="dialog" role="alertdialog" aria-labelledby="err-title" aria-describedby="err-desc">
    <div class="bar"><span>파일 탐색기</span><span class="ctl"><a href="/portfolio/os/index.html" aria-label="닫고 바탕화면으로">✕</a></span></div>
    <div class="d-body">
      <span class="d-icon" aria-hidden="true">!</span>
      <div>
        <h1 id="err-title">페이지를 찾을 수 없습니다</h1>
        <p id="err-desc"><code id="err-path">이 주소</code>에 해당하는 파일이 없습니다. 주소가 바뀌었거나 잘못 입력되었을 수 있습니다.</p>
      </div>
    </div>
    <div class="d-foot"><a class="btn" href="/portfolio/os/index.html#projects">프로젝트 목록</a><a class="btn primary" href="/portfolio/os/index.html">바탕화면으로</a></div>
  </div>
</main>
<script>document.getElementById("err-path").textContent = decodeURIComponent(location.pathname);</script>
</body>
